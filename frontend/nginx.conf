# Redirección global de HTTP (puerto 80) a HTTPS (puerto 443)
server {
    listen 80;
    server_name ventasfix.duckdns.org localhost;

    # Permitir renovación automática de Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor seguro HTTPS (puerto 443) con SSL/TLS
server {
    listen 443 ssl;
    server_name ventasfix.duckdns.org localhost;

    # Certificados SSL emitidos por Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/ventasfix.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ventasfix.duckdns.org/privkey.pem;

    # Protocolos y cifrado seguro moderno (TLS 1.2 y 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compresión Gzip para mejorar el rendimiento de carga
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache para activos estáticos con hash
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Proxy inverso para la API (comunicación bajo HTTPS)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Soporte SPA: Redirigir cualquier ruta no encontrada a index.html (evita 404 en F5)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manejo de errores
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ==============================================================================
# CONFIGURACIÓN BANCO NOVATERRA (chatbot-novaterra.duckdns.org)
# ==============================================================================

# Redirección global de HTTP (puerto 80) a HTTPS (puerto 443) para NovaTerra
server {
    listen 80;
    server_name chatbot-novaterra.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor seguro HTTPS (puerto 443) con SSL/TLS para NovaTerra
server {
    listen 443 ssl;
    server_name chatbot-novaterra.duckdns.org;

    # Certificados SSL de Let's Encrypt para NovaTerra
    ssl_certificate /etc/letsencrypt/live/chatbot-novaterra.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot-novaterra.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL_NOVATERRA:10m;
    ssl_session_timeout 1d;

    # Resolución dinámica con Docker DNS para evitar caídas si el contenedor no está listo
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $novaterra_target http://novaterra-frontend:80;

    location / {
        proxy_pass $novaterra_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
    }
}
