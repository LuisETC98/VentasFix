services:
  # Servicio de Base de Datos MySQL 8
  db:
    image: mysql:8.0.45
    container_name: ventasfix-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin123}
      MYSQL_DATABASE: ${DB_NAME:-ventasfix}
      MYSQL_USER: ${DB_USER:-ventasfix_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ventasfix_pass123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ventasfix-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-admin123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Servicio Backend (Spring Boot 4 / Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventasfix-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-ventasfix}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ventasfix_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ventasfix_pass123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-94a08da1fecbb6e8b46990538c7b50b2b8c5f7d2f9e1e9a3b2c1d0e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - ventasfix-network

  # Servicio Frontend (React 19 / Vite / Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Usa '/api' si todo corre a través de Nginx en el puerto 80, o la IP pública de OCI
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: ventasfix-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - ventasfix-network

volumes:
  mysql_data:
    driver: local

networks:
  ventasfix-network:
    driver: bridge
